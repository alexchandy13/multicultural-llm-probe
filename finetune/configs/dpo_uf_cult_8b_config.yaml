# DPO on culturally-tagged UltraFeedback pairs, Llama 3.1 8B.
# Data prepared by data/prepare_cultural_splits.py (culture_tag != NoCulture).
# Recipe identical to dpo_8b_config.yaml; only dataset and output_dir differ.

model_name_or_path: meta-llama/Llama-3.1-8B
dataset_name: uf_cult
dataset_path: data/uf_cult
output_dir: checkpoints/dpo_uf_cult_8b

max_train_examples: 30000

num_train_epochs: 2
per_device_train_batch_size: 1
gradient_accumulation_steps: 32
learning_rate: 5.0e-5
warmup_ratio: 0.1
lr_scheduler_type: cosine
weight_decay: 0.0
max_grad_norm: 1.0
optim: paged_adamw_8bit
max_length: 512
max_prompt_length: 256

beta: 0.1
loss_type: sigmoid

save_strategy: epoch
save_total_limit: 2
logging_steps: 25
report_to: none
seed: 42

early_stop:
  enabled: true
  patience_windows: 4

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
